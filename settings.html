        function get_tables_data_as_json() {
            let finalData = {};
            document.querySelectorAll('tbody').forEach(tbody => {
                let tableId = tbody.id;
                finalData[tableId] = [];

                tbody.querySelectorAll('tr').forEach(tr => {
                    let rowData = {};
                    tr.querySelectorAll('input, textarea').forEach(el => {
                        let key = el.name || "unnamed"; // fallback في حالة مفيش name
                        let value = (el.tagName.toLowerCase() === "textarea") ? el.value : el.value;
                        rowData[key] = value;
                    });
                    finalData[tableId].push(rowData);
                });
            });

            finalData['profile'] = []
            finalData.profile.push({
                img: document.querySelector('#profile_img_input').value,
                slogan: document.querySelector('#slogan').value,
                about: document.querySelector('#about').value
            });


            console.log(finalData)





            return finalData
        }
